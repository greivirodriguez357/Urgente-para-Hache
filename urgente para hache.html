<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Urgente para Hache 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #a8d4f5 0%, #4a90d9 40%, #b3d9f7 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ===== FONDO BURBUJAS ===== */
  .bubbles {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) scale(0.8); opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  /* ===== CONTENEDOR PRINCIPAL ===== */
  .screen {
    display: none;
    position: relative;
    z-index: 10;
    animation: fadeIn 0.5s ease;
  }
  .screen.active { display: flex; flex-direction: column; align-items: center; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

  /* ===== PANTALLA 1: CREMALLERA ===== */
  #screen1 { gap: 20px; }

  .zip-card {
    width: 280px;
    height: 360px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(30,80,200,0.25);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
  }

  /* La carta "cerrada" se divide en dos mitades */
  .zip-top, .zip-bottom {
    position: absolute;
    left: 0; right: 0;
    background: white;
    transition: none;
  }
  .zip-top    { top: 0; height: 50%; }
  .zip-bottom { bottom: 0; height: 50%; }

  /* Dientes de cremallera */
  .zip-track {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    top: 0;
    bottom: 0;
    z-index: 20;
    pointer-events: none;
  }
  .zip-tooth {
    width: 10px;
    height: 8px;
    background: #1565c0;
    transition: opacity 0.05s;
  }

  /* Tirador de cremallera */
  .zip-puller {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 20px;
    width: 22px;
    height: 34px;
    z-index: 30;
    cursor: grab;
    transition: top 0.02s linear;
  }
  .zip-puller:active { cursor: grabbing; }
  .zip-puller-head {
    width: 22px;
    height: 22px;
    background: #1565c0;
    border-radius: 4px;
    border: 2px solid #0d47a1;
    display: flex; align-items: center; justify-content: center;
  }
  .zip-puller-head::after {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
  }
  .zip-puller-tail {
    width: 4px;
    height: 14px;
    background: #1565c0;
    margin: 0 auto;
    border-radius: 0 0 3px 3px;
  }

  /* Contenido dentro de la carta (oculto hasta abrir) */
  .zip-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.4s 0.2s;
    padding: 20px;
    text-align: center;
  }
  .zip-inner.revealed { opacity: 1; }
  .zip-inner .heart-big { font-size: 52px; animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
  .zip-inner p { font-size: 15px; color: #1565c0; font-weight: 600; line-height: 1.5; }

  /* Línea de rasgado cuando se abre */
  .rip-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: repeating-linear-gradient(90deg, #1565c0 0px, #1565c0 8px, transparent 8px, transparent 14px);
    z-index: 25;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .zip-hint {
    font-size: 15px;
    color: white;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    letter-spacing: 0.03em;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }

  .btn-open {
    margin-top: 10px;
    padding: 12px 32px;
    background: white;
    color: #1565c0;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: transform 0.15s, box-shadow 0.15s;
    display: none;
  }
  .btn-open:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(0,0,0,0.2); }
  .btn-open.show { display: block; }

  /* ===== PANTALLA 2: PREGUNTA ===== */
  #screen2 { gap: 24px; }

  .question-card {
    background: white;
    border-radius: 24px;
    padding: 28px 24px;
    width: 300px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(30,80,200,0.25);
  }
  .question-card h2 {
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #222;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .penguin-gif {
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    background: #e8f4fd;
    display: flex; align-items: center; justify-content: center;
  }

  /* Pinguinos SVG animados */
  .penguins-art { width: 140px; height: 140px; }

  .btns-area {
    position: relative;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .btn-si {
    padding: 12px 36px;
    background: #4caf50;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(76,175,80,0.4);
    transition: transform 0.15s;
  }
  .btn-si:hover { transform: scale(1.07); }

  .btn-no {
    padding: 12px 36px;
    background: #f44336;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(244,67,54,0.4);
    position: fixed;
    transition: none;
    pointer-events: auto;
    z-index: 999;
  }

  /* ===== PANTALLA 3: GRACIAS ===== */
  #screen3 { gap: 20px; text-align: center; }

  .thanks-title {
    font-family: 'Pacifico', cursive;
    font-size: 40px;
    color: #1565c0;
    text-shadow: 0 2px 12px rgba(21,101,192,0.25);
    animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes bounceIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .thanks-sub {
    font-size: 17px;
    color: white;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .cat-frame {
    width: 280px;
    height: 210px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(30,80,200,0.3);
    background: #111;
    position: relative;
  }

  /* Cat SVG animado */
  .cat-art {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #2a2a3e 0%, #1a1a2e 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* ===== CONFETTI ===== */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotateZ(0deg) rotateX(0deg); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(110vh) rotateZ(720deg) rotateX(360deg); opacity: 0; }
  }
  /* ===== NOTA TIERNA FINAL ===== */
  .love-note {
    background: rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 16px 24px;
    text-align: center;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.4);
    max-width: 300px;
    animation: fadeIn 0.8s ease 0.4s both;
  }
  .note-line {
    color: white;
    font-size: 14px;
    font-weight: 600;
    text-shadow: 0 1px 6px rgba(0,0,0,0.15);
    line-height: 1.6;
  }
  .note-big {
    font-size: 18px;
    font-weight: 800;
  }
  .note-small {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 4px;
  }
</style>
</head>
<body>

<!-- Burbujas de fondo -->
<div class="bubbles" id="bubbles"></div>

<!-- ===== PANTALLA 1: CREMALLERA ===== -->
<div class="screen active" id="screen1">
  <div class="zip-card" id="zipCard">
    <div class="zip-top" id="zipTop"></div>
    <div class="zip-bottom" id="zipBottom"></div>
    <div class="rip-line" id="ripLine"></div>

    <!-- Dientes de cremallera -->
    <div class="zip-track" id="zipTrack"></div>

    <!-- Tirador -->
    <div class="zip-puller" id="zipPuller">
      <div class="zip-puller-head"></div>
      <div class="zip-puller-tail"></div>
    </div>

    <!-- Contenido revelado -->
    <div class="zip-inner" id="zipInner">
      <div class="heart-big">🔐</div>
      <p>Oye… tengo algo<br><em> muy importante </em><br> que decirte, pero aún no me atrevo </p>
    </div>
  </div>

  <p class="zip-hint"> Ey jala el cordón...</p>
  <p class="zip-hint"> 🡳 </p>
  <button class="btn-open" id="btnOpen" onclick="goToScreen2()">Abrir carta →</button>
</div>

<!-- ===== PANTALLA 2: PREGUNTA ===== -->
<div class="screen" id="screen2">
  <div class="question-card">
    <h2>Cuando vengas… <br> ¿me compras una salchipapa? <br>🍟 </h2>

    <!-- GIF pareja comiendo -->
    <div class="penguin-gif">
      <img src="https://media1.tenor.com/m/qd-CUeSFyLAAAAAC/eating-couple.gif" style="width:140px; height:140px; object-fit:cover; border-radius:14px; display:block;">
    </div>

    <div class="btns-area" id="btnsArea">
      <button class="btn-si" onclick="goToScreen3()">Obvio 🍟💙</button>
      <button class="btn-no" id="btnNo">No</button>
    </div>
  </div>
</div>

<!-- ===== PANTALLA 3: GRACIAS ===== -->
<div class="screen" id="screen3">
  <h1 class="thanks-title"> Graciasss </h1>
  <p class="thanks-sub"> Hache es el mejor 🍟💙</p>

  <!-- GIF gatito besando -->
  <div class="cat-frame">
    <img src="https://media1.tenor.com/m/QaPEi-tcFXQAAAAC/gato-besando-a-la-camara.gif" style="width:280px; height:210px; object-fit:cover; border-radius:18px; display:block;">
  </div>

  <!-- Mensaje tierno -->
  <div class="love-note">
    <p class="note-line">…bueno, y también tengo </p>
    <p class="note-line note-big">ganas de verte </p>
    <p class="note-line note-small">ya estoy contando los días pa mi salchipapa jajajaja <br> Tqm <br> </p>
    <p class="note-line note-big"> Att: Grace </p>
  </div>
</div>

<script>
  // === BURBUJAS DE FONDO ===
  const bubblesEl = document.getElementById('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 20 + Math.random() * 60;
    b.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${6+Math.random()*8}s;
      animation-delay:${Math.random()*6}s;
    `;
    bubblesEl.appendChild(b);
  }

  // === CREMALLERA ===
  const zipCard   = document.getElementById('zipCard');
  const zipPuller = document.getElementById('zipPuller');
  const zipTrack  = document.getElementById('zipTrack');
  const zipTop    = document.getElementById('zipTop');
  const zipBottom = document.getElementById('zipBottom');
  const zipInner  = document.getElementById('zipInner');
  const ripLine   = document.getElementById('ripLine');
  const btnOpen   = document.getElementById('btnOpen');

  // Generar dientes
  for (let i = 0; i < 26; i++) {
    const t = document.createElement('div');
    t.className = 'zip-tooth';
    t.id = 'tooth' + i;
    zipTrack.appendChild(t);
  }

  const CARD_H     = 360;
  const PULL_MIN   = 20;
  const PULL_MAX   = CARD_H - 40;
  let   pulling    = false;
  let   startY     = 0;
  let   pullerTop  = PULL_MIN;
  let   maxPull    = PULL_MIN;
  let   opened     = false;
  let musicStarted = false;

  function getPullerY(e) {
    return e.touches ? e.touches[0].clientY : e.clientY;
  }

  zipPuller.addEventListener('mousedown',  startPull);
  zipPuller.addEventListener('touchstart', startPull, { passive: false });

  function startPull(e) {

  // === MÚSICA 💖 ===

  const music = document.getElementById('bgMusic');

  if (!musicStarted) {

    musicStarted = true;

    music.volume = 0;

    music.play().catch(() => {});

    let vol = 0;

    const fade = setInterval(() => {

      if (vol < 0.15) {

        vol += 0.01;

        music.volume = vol;

      } else {

        clearInterval(fade);

      }

    }, 180);

  }

  if (opened) return;

  pulling = true;

  startY = getPullerY(e) - pullerTop;

  document.addEventListener('mousemove', doPull);

  document.addEventListener('touchmove', doPull, { passive: false });

  document.addEventListener('mouseup', stopPull);

  document.addEventListener('touchend', stopPull);

}

  function doPull(e) {
    if (e.cancelable) e.preventDefault();
    if (!pulling) return;
    const y = getPullerY(e) - startY;
    pullerTop = Math.max(PULL_MIN, Math.min(PULL_MAX, y));
    zipPuller.style.top = pullerTop + 'px';

    if (pullerTop > maxPull) maxPull = pullerTop;

    
    const progress = (pullerTop - PULL_MIN) / (PULL_MAX - PULL_MIN);

    
    const split = progress * 120;
    zipTop.style.transform    = `translateY(-${split}px)`;
    zipBottom.style.transform = `translateY(${split}px)`;

  
    const teeth = zipTrack.querySelectorAll('.zip-tooth');
    teeth.forEach((t, i) => {
      const threshold = i / teeth.length;
      t.style.opacity = progress > threshold ? '0' : '1';
    });

    ripLine.style.opacity = progress > 0.1 ? Math.min(1, progress * 2) : '0';

   
    if (progress > 0.55) zipInner.classList.add('revealed');

 
    if (progress > 0.7 && !opened) {
      opened = true;
      zipPuller.style.cursor = 'default';
      setTimeout(() => {
        btnOpen.classList.add('show');
        btnOpen.style.display = 'block';
      }, 200);
    }
  }

  function stopPull() {
    pulling = false;
    document.removeEventListener('mousemove', doPull);
    document.removeEventListener('touchmove', doPull);
    document.removeEventListener('mouseup',   stopPull);
    document.removeEventListener('touchend',  stopPull);
  }

  // === NAVEGACIÓN ===
  function goToScreen2() {
    document.getElementById('screen1').classList.remove('active');
    const s2 = document.getElementById('screen2');
    s2.classList.add('active');
    positionBtnNo();
  }

  function goToScreen3() {
    document.getElementById('screen2').classList.remove('active');
    document.getElementById('screen3').classList.add('active');
    launchConfetti();
  }

  // === BOTÓN NO QUE ESCAPA ===
  const btnNo = document.getElementById('btnNo');
  let noPlaced = false;

  function positionBtnNo() {
    // Posición inicial: debajo del botón Sí
    const btnsArea = document.getElementById('btnsArea');
    const rect = btnsArea.getBoundingClientRect();
    btnNo.style.left = (rect.right - 100) + 'px';
    btnNo.style.top  = (rect.top + 14) + 'px';
    noPlaced = true;
  }

  btnNo.addEventListener('mousemove', runAway);
  btnNo.addEventListener('touchstart', runAway, {passive:true});

  function runAway(e) {
    const margin = 40;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const btnW = btnNo.offsetWidth;
    const btnH = btnNo.offsetHeight;

    // Nueva posición aleatoria lejos del cursor
    let nx, ny;
    let attempts = 0;
    do {
      nx = margin + Math.random() * (vw - btnW - margin * 2);
      ny = margin + Math.random() * (vh - btnH - margin * 2);
      attempts++;
    } while (attempts < 20);

    btnNo.style.transition = 'left 0.25s cubic-bezier(0.34,1.56,0.64,1), top 0.25s cubic-bezier(0.34,1.56,0.64,1)';
    btnNo.style.left = nx + 'px';
    btnNo.style.top  = ny + 'px';

    // Rota y salta un poco
    btnNo.style.transform = `rotate(${(Math.random()-0.5)*30}deg) scale(${0.85+Math.random()*0.3})`;
    setTimeout(() => { btnNo.style.transform = ''; }, 300);
  }

  // === CONFETTI ===
  const confettiColors = ['#42a5f5','#1565c0','#90caf9','#ffd700','#64b5f6','#1e88e5','#bbdefb','#0d47a1'];

  function launchConfetti() {
    for (let i = 0; i < 120; i++) {
      setTimeout(() => spawnConfetto(), i * 25);
    }
  }

  function spawnConfetto() {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 7 + Math.random() * 10;
    const isCircle = Math.random() > 0.5;
    el.style.cssText = `
      left: ${Math.random() * 100}vw;
      width: ${size}px;
      height: ${isCircle ? size : size * 0.5}px;
      border-radius: ${isCircle ? '50%' : '2px'};
      background: ${confettiColors[Math.floor(Math.random()*confettiColors.length)]};
      animation-duration: ${1.5 + Math.random() * 2}s;
      animation-delay: ${Math.random() * 0.5}s;
      opacity: 1;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

</script>

<audio id="bgMusic" loop>
  <source src="valentine.mp3" type="audio/mpeg">
</audio>

</body>
</html>
</body>
